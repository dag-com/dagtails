name: Player report

# Pulls live events, commits docs/player-reports/, and publishes the
# reviewer site to https://dag-com.github.io/last-call-bartending-game/player-reports/

on:
  schedule:
    # 07:00 UTC = 10:00 Israel summer / 09:00 winter
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: player-report
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require database URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Add repo secret SUPABASE_DB_URL (Postgres URI from Supabase → Project Settings → Database)."
            echo "The anon key cannot read events. See docs/player-reports/SETUP.md"
            exit 1
          fi

      - name: Fetch snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node .cursor/skills/player-report/scripts/fetch.js

      - name: Render markdown
        run: node .cursor/skills/player-report/scripts/render.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player-reports
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "player-report: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
          git pull --ff-only origin master || true

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  publish:
    needs: snapshot
    runs-on: ubuntu-latest
    # Separate from the game ship so a daily report cannot cancel a Pages deploy in progress.
    concurrency:
      group: player-report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewer URL
        id: deployment
        uses: actions/deploy-pages@v4
