<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Double jigger (Japanese style): two cones joined at the waist -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f5f7"/>
      <stop offset="45%" stop-color="#c5ccd4"/>
      <stop offset="100%" stop-color="#8a939e"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dde0"/>
      <stop offset="100%" stop-color="#6f7883"/>
    </linearGradient>
  </defs>
  <!-- Upper cup (1 oz) -->
  <path d="M22 6 L42 6 L36 28 L28 28 Z" fill="url(#steel)" stroke="#5c6570" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Waist ring -->
  <rect x="26" y="27" width="12" height="5" rx="1.5" fill="url(#steelDark)" stroke="#5c6570" stroke-width="1.2"/>
  <!-- Lower cup (1.5/2 oz), inverted -->
  <path d="M28 32 L36 32 L44 58 L20 58 Z" fill="url(#steel)" stroke="#5c6570" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Rim highlights -->
  <path d="M24 7.2 H40" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M22.5 56.5 H41.5" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
</svg>
