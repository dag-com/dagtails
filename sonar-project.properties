# DAG Tails — SonarQube
sonar.projectKey=dag-tails
sonar.projectName=DAG Tails
sonar.sourceEncoding=UTF-8

# Local SonarQube. GitHub Actions overrides this with secrets.SONAR_HOST_URL.
sonar.host.url=http://127.0.0.1:9000

# Game + hub + backend. Built www/, native shells, and mocks stay out.
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  www/**,\
  android/**,\
  ios/**,\
  mobile/**,\
  mocks/**,\
  exports/**,\
  playwright-report/**,\
  test-results/**,\
  assets/**,\
  public/**,\
  sonar/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.webp,\
  **/*.gif,\
  **/*.map

sonar.tests=tests
sonar.test.inclusions=**/*.spec.js

# Playwright does not emit lcov yet. Add sonar.javascript.lcov.reportPaths later if you want coverage.
